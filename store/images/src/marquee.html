<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body {
    width: 1400px; height: 560px; overflow: hidden; position: relative; color: #fff;
    background: linear-gradient(135deg, #6d28d9 0%, #4f46e5 55%, #4338ca 100%);
  }
  .glow1 { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.14), transparent 60%); right: -220px; top: -320px; }
  .glow2 { position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08), transparent 60%); left: -200px; bottom: -320px; }
  .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 46px; padding: 0 90px; }
  .icon { width: 200px; height: 200px; flex: none; filter: drop-shadow(0 14px 34px rgba(0,0,0,.4)); }
  .text h1 { margin: 0 0 18px; font-size: 64px; font-weight: 700; letter-spacing: 1px; }
  .text .tag { margin: 0 0 26px; font-size: 26px; color: rgba(255,255,255,.92); }
  .chips { display: flex; gap: 16px; }
  .chip {
    padding: 12px 22px; border-radius: 999px; font-size: 22px;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.4);
  }
  .fine { position: absolute; left: 90px; bottom: 44px; font-size: 18px; color: rgba(255,255,255,.82); }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div>
  <div class="row">
    <svg class="icon" viewBox="0 0 128 128"><rect x="16" y="16" width="96" height="96" rx="26" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.65)" stroke-width="3"/><g transform="translate(70 64) skewX(-9) translate(-70 -64)"><path d="M60.4 86.5 V41.5 H72.4 A10.35 10.35 0 0 1 72.4 62.2 H60.4 M60.4 62.2 H73.4 A12.15 12.15 0 0 1 73.4 86.5 H60.4" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g><g stroke="#FFFFFF" stroke-linecap="round" stroke-width="6"><path d="M29 52 H41" opacity="0.7"/><path d="M24 64 H40"/><path d="M29 76 H38" opacity="0.7"/></g></svg>
    <div class="text">
      <h1>Seamless for Bilibili</h1>
      <p class="tag">海外党看 Bilibili 经常卡？视频在 1080p 画质、2 倍速播放下保持流畅。</p>
      <div class="chips">
        <span class="chip">双镜像竞速下载</span>
        <span class="chip">120 秒缓冲目标</span>
        <span class="chip">视频 · 直播</span>
        <span class="chip">数据不离开本机</span>
      </div>
    </div>
  </div>
  <div class="fine">代价如实相告：竞速与直播双路都会多用流量，直播 FLV 接近单路的两倍，HLS 约 1.3 倍；详见商店说明与 README。</div>
</body>
</html>
