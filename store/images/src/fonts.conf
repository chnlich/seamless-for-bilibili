<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Segoe UI</family><family>Microsoft YaHei</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Segoe UI</family><family>Microsoft YaHei</family></prefer></alias>
</fontconfig>
