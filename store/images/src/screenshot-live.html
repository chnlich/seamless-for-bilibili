<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; overflow: hidden; position: relative; background: #10131a; }
  .page-bg {
    position: absolute; inset: 0;
    background-image: var(--page-image);
    background-size: cover; background-position: center;
    filter: blur(14px) saturate(1.05);
    transform: scale(1.04);
  }
  .page-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,22,.55), rgba(10,14,22,.72)); }
  .caption { position: absolute; left: 56px; top: 64px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.55); max-width: 620px; }
  .caption h1 { margin: 0 0 14px; font-size: 44px; font-weight: 700; letter-spacing: 1px; }
  .caption p { margin: 0; font-size: 22px; line-height: 1.6; color: rgba(255,255,255,.92); }
  .caption .pill {
    display: inline-block; margin-top: 22px; padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
    font-size: 18px; color: #fff;
  }
  .popup {
    position: absolute; right: 64px; top: 74px;
    width: 460px;
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.18);
    overflow: hidden;
  }
  .popup img { display: block; width: 100%; }
  .credit { position: absolute; left: 56px; bottom: 40px; color: rgba(255,255,255,.75); font-size: 15px; }
</style>
</head>
<body>
  <div class="page-bg" style="--page-image: url('../../store-images-raw/live-page.png')"></div>
  <div class="page-tint"></div>
  <div class="caption">
    <h1>直播页同样接管下载</h1>
    <p>直播弹窗显示接管状态与线路数据；<!--LIVE_NOTE-->弹窗为真实运行截图。</p>
    <span class="pill">视频与直播都支持</span>
  </div>
  <div class="popup"><img src="../popup-live.png" alt="扩展弹窗：直播接管状态与下载线路"></div>
  <div class="credit">直播页 · 接管状态与线路数据为扩展实测数据</div>
</body>
</html>
