<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body {
    width: 440px; height: 280px; overflow: hidden; position: relative; color: #fff;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  }
  .glow { position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.16), transparent 62%); right: -130px; top: -150px; }
  .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 22px; padding: 0 34px; }
  .icon { width: 108px; height: 108px; flex: none; filter: drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .text h1 { margin: 0 0 10px; font-size: 33px; font-weight: 700; letter-spacing: .5px; }
  .text p { margin: 0; font-size: 18px; line-height: 1.55; color: rgba(255,255,255,.92); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="row">
    <svg class="icon" viewBox="0 0 128 128"><rect x="16" y="16" width="96" height="96" rx="26" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.65)" stroke-width="3"/><path d="M53 40 L53 74 L82 57 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/><rect x="42" y="84" width="48" height="10" rx="5" fill="#FFFFFF" opacity="0.45"/><rect x="42" y="84" width="34" height="10" rx="5" fill="#FFFFFF"/></svg>
    <div class="text">
      <h1>Bilibili 桌面网页抗卡</h1>
      <p>双镜像竞速下载 · 120 秒缓冲<br>视频与直播都支持</p>
    </div>
  </div>
</body>
</html>
