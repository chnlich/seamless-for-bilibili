<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili 抗卡</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="head">
        <h1>Bilibili 抗卡</h1>
        <div class="switches">
          <label class="switch-row">
            <span>视频增强</span>
            <input type="checkbox" data-preference="vodEnabled">
          </label>
          <label class="switch-row">
            <span>直播增强</span>
            <input type="checkbox" data-preference="liveEnabled">
          </label>
        </div>
      </header>
      <p class="hint">开关改动在刷新页面后生效。</p>

      <section class="card" aria-label="缓冲" data-vod-only>
        <h2>缓冲</h2>
        <div class="buffer-bar" data-buffer-bar>
          <div class="buffer-fill" data-buffer-fill></div>
        </div>
        <p class="buffer-line">
          <strong class="buffer-seconds" data-buffer-seconds>—</strong>
          <span class="buffer-goal" data-buffer-goal></span>
        </p>
        <p class="buffer-note" data-buffer-note hidden></p>
        <p class="target-state" data-status-field="state" hidden>
          <span class="target-label" data-buffer-target-label></span>
          <span class="target-value" data-target-value></span>
        </p>
      </section>

      <section class="card" aria-label="下载线路">
        <h2>下载线路</h2>
        <div data-cdn-lines></div>
      </section>

      <section class="card" aria-label="直播接管" data-live-panel hidden>
        <h2>直播接管</h2>
        <p class="takeover" data-live-takeover></p>
      </section>

      <p class="error-line" data-status-field="error" hidden></p>
      <p class="notice" data-notice role="status"></p>

      <footer class="foot">
        <button type="button" class="link-button" data-open-logs>打开开发日志</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
